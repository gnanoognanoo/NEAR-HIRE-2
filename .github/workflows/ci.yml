name: NearHire checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
            apps/admin/package-lock.json
      - run: npm ci
      - run: npm --prefix apps/mobile ci
      - run: npm --prefix apps/admin ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run test:db
      - run: npm run build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test --config supabase/functions/deno.json supabase/functions/_shared/runtime_test.ts supabase/functions/location/provider_test.ts
