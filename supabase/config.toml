project_id = "nearhire"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 100
[db]
port = 54322
major_version = 17
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[auth]
enabled = true
site_url = "http://localhost:8089"
additional_redirect_urls = ["nearhire://**", "http://localhost:3000/**"]
jwt_expiry = 3600
enable_signup = true
[auth.sms]
enable_signup = true
enable_confirmations = true
max_frequency = "60s"
# Local development only. Never copy these test OTPs to hosted production.
[auth.sms.test_otp]
919000000001 = "123456"
919000000002 = "123456"
[functions.razorpay-webhook]
verify_jwt = false
[functions.notification-dispatch]
verify_jwt = false
[functions.location]
verify_jwt = false
[functions.payment-order]
verify_jwt = false
[functions.delete-account]
verify_jwt = false

[functions.payment-verify]
verify_jwt = false
